[project]
name = "macro-signal-engine"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.19.2",
    "celery>=5.6.3",
    "cryptography>=50.0.1",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.3.5",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "redis>=8.1.0",
    "sqlalchemy>=2.0.52",
    "structlog>=99.0.0",
    "uvicorn[standard]>=0.52.4",
]

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pyrefly>=1.2.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "respx>=0.23.1",
    "ruff>=0.16.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 88
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]

[tool.pyrefly]
preset = "strict"

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
